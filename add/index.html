<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add me on Cover</title>
<style>
  :root { --gold:#f5c518; --ink:#0a0a0e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(120% 70% at 12% -10%, rgba(58,90,180,.38) 0%, rgba(10,10,14,0) 62%), var(--ink);
         color:#fff; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         position:relative; overflow:hidden; text-align:center; }
  body::before { content:""; position:absolute; inset:0; pointer-events:none;
                 background:repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 1px, transparent 1px 26px); }
  .card { position:relative; padding:44px 28px; max-width:360px; }
  .masthead { font-size:26px; font-weight:900; letter-spacing:11px; text-indent:11px; }
  .rule { width:132px; height:3px; background:var(--gold); margin:14px auto; border-radius:2px; }
  .tag { font-size:10px; letter-spacing:3.4px; color:#8b8f98; font-weight:600; margin-bottom:34px; }
  h1 { font-size:24px; margin:0 0 10px; font-weight:800; }
  h1 .name { color:var(--gold); }
  p { color:#9ca3af; font-size:15px; line-height:1.55; margin:0 auto 30px; max-width:300px; }
  .btn { display:block; text-decoration:none; font-weight:700; font-size:16px;
         padding:15px 20px; border-radius:999px; margin:0 auto 12px; max-width:290px; }
  .primary { background:#fff; color:#000; }
  .secondary { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.22); }
  .fine { font-size:12px; color:#6b7280; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="masthead">COVER</div>
    <div class="rule"></div>
    <div class="tag">THE NEWS, IN REELS</div>

    <h1><span class="name" id="who">A friend</span> wants to connect on Cover</h1>
    <p>Cover turns the day's news into swipeable cards — verified across outlets, and better with friends.</p>

    <a class="btn primary" id="open" href="#">Open in Cover</a>
    <a class="btn secondary" href="https://apps.apple.com/app/id0000000000">Get Cover on the App Store</a>

    <div class="fine">Already have the app? Tapping this link opens their profile.</div>
  </div>

<script>
  // ?u=<user id>&n=<display name>. The app itself handles this URL through
  // universal links; this page is the fallback for people without it yet.
  var q = new URLSearchParams(location.search);
  var name = (q.get("n") || "").trim();
  if (name) { document.getElementById("who").textContent = name; }
  // If the app is installed, iOS intercepts this URL before the page ever
  // loads. Reaching this page means it probably is not — so the primary
  // action is the App Store, and reloading is the only "open" we can offer.
  document.getElementById("open").setAttribute("href", location.href);
</script>
</body>
</html>
